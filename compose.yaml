services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static-data:/app/staticfiles
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_CONTACT_URL: ${VITE_CONTACT_URL:-}
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
    volumes:
      - static-data:/var/www/static:ro
volumes:
  postgres-data:
  static-data:
